server:
  port: 8080

spring:
  application:
    name: disaster-relocation-backend

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:disaster_relocation}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only validates it matches the entities.
      ddl-auto: validate
    properties:
      hibernate:
        # No spatial-specific dialect class needed on Hibernate 6: with the
        # hibernate-spatial jar on the classpath, spatial types/functions are
        # auto-contributed on top of the standard PostgreSQL dialect, which
        # Hibernate auto-detects from the JDBC connection.
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

app:
  ml:
    base-url: ${ML_BASE_URL:http://172.20.10.3:8001/api}
  jwt:
    # Override via env var in real deployments - never commit a real secret.
    secret: ${JWT_SECRET:change-this-dev-only-secret-key-please-32-bytes-min}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24h
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    org.hibernate.SQL: ${SQL_LOG_LEVEL:WARN}
    com.sih.disaster: INFO
